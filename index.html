<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHELL | Modern Decor</title>
    <!-- Typewriter Font Added -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <style>
        /* INVERTED COLORS & TYPEWRITER FONT */
        body { 
            margin: 0; 
            font-family: 'Courier Prime', 'Courier New', Courier, monospace; 
            background: #000000; 
            color: #ffffff; 
            overflow-x: hidden; 
        }
        
        /* LOADER STYLES */
        #loader { 
            position: fixed; 
            width: 100%; 
            height: 100%; 
            background: black; 
            color: white; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 64px; 
            letter-spacing: 8px; 
            z-index: 2000; 
            font-family: 'Impact', 'Arial Black', sans-serif;
            text-transform: uppercase;
            transition: opacity 1s ease;
        }

        #shader-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #loader span {
            position: relative;
            z-index: 2001;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        /* DARK THEME UI ELEMENTS */
        .trust-bar { background: #111; border-bottom: 1px solid #333; text-align: center; padding: 6px 0; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: #888; }
        header { text-align: center; margin: 40px 0 20px 0; font-size: 34px; letter-spacing: 6px; font-weight: bold; }
        .caption { font-size: 13px; letter-spacing: 4px; margin-top: 8px; opacity: .6; text-transform: uppercase; }
        
        .menu { position: fixed; left: 20px; top: 25px; font-size: 28px; cursor: pointer; z-index: 1001; color: #fff; }
        .sidebar { position: fixed; left: -280px; top: 0; width: 280px; height: 100%; background: #0a0a0a; border-right: 1px solid #333; transition: .4s cubic-bezier(0.4, 0, 0.2, 1); padding-top: 80px; z-index: 1000; }
        .sidebar.open { left: 0; }
        .closeSidebar { position: absolute; top: 20px; right: 25px; font-size: 26px; cursor: pointer; color: #fff; }
        .sidebar a { display: block; padding: 18px 30px; text-decoration: none; color: #fff; font-size: 17px; letter-spacing: 1px; cursor: pointer; }
        .sidebar-bottom { position: absolute; bottom: 30px; width: 100%; border-top: 1px solid #333; padding-top: 10px; }
        
        .cart { position: fixed; right: 20px; top: 25px; background: white; color: black; padding: 8px 16px; border-radius: 30px; cursor: pointer; z-index: 1001; font-weight: bold; }
        
        .products { padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .product img { width: 100%; border-radius: 12px; cursor: pointer; aspect-ratio: 1/1; object-fit: cover; background: #111; }
        .price { font-weight: bold; margin-top: 10px; font-size: 16px; color: #fff; }
        .old { text-decoration: line-through; color: #666; font-size: 13px; margin-left: 6px; }
        .off { color: #2ecc71; font-size: 13px; font-weight: bold; }
        .emi-tag { font-size: 11px; color: #888; margin-top: 4px; }
        .product button { width: 100%; padding: 12px; margin-top: 10px; border: none; background: white; color: black; cursor: pointer; font-weight: bold; border-radius: 6px; font-size: 13px; font-family: 'Courier Prime', monospace; }
        
        /* Mobile-First Button Press Effect */
        button:active, .cart:active, .ig:active, .menu:active { transform: scale(0.95); opacity: 0.8; transition: all 0.1s ease; }
        
        #productPage { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050505; z-index: 1200; overflow-y: auto; }
        .viewer { max-width: 480px; margin: 40px auto; padding: 0 20px; text-align: center; position: relative; box-sizing: border-box; }
        .closePage { position: absolute; right: 15px; top: -15px; font-size: 32px; cursor: pointer; z-index: 100; color: #fff; }
        
        /* SCROLL SNAP SLIDER */
        .slider-container { position: relative; overflow: hidden; border-radius: 15px; background: #111; }
        .slider-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
        .slider-track::-webkit-scrollbar { display: none; }
        .slider-track img { width: 100%; flex: 0 0 100%; scroll-snap-align: start; object-fit: contain; max-height: 60vh; }
        
        .dots { text-align: center; margin-top: 15px; }
        .dot { height: 8px; width: 8px; background: #444; display: inline-block; border-radius: 50%; margin: 0 4px; transition: 0.3s; }
        .dot.active { background: white; width: 20px; border-radius: 10px; }
        
        .desc { margin-top: 25px; line-height: 1.6; color: #bbb; font-size: 15px; text-align: left; }
        .dim { margin-top: 15px; font-weight: bold; border-top: 1px solid #222; padding-top: 15px; }
        .color-selector { margin-top: 15px; text-align: left; }
        .color-selector label { font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; color: #aaa; }
        
        .cartButton { width: 100%; padding: 16px; background: white; color: black; border: none; margin-top: 12px; cursor: pointer; font-weight: bold; font-size: 16px; border-radius: 8px; font-family: 'Courier Prime', monospace; }
        
        .popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 1500; backdrop-filter: blur(6px); }
        .popup-content { background: #111; padding: 30px; width: 90%; max-width: 420px; border-radius: 20px; border: 1px solid #333; position: relative; max-height: 85vh; overflow-y: auto; color: white; }
        .closePopup { position: absolute; right: 20px; top: 20px; font-size: 26px; cursor: pointer; color: white; }
